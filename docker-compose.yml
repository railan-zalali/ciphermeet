version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ciphermeet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ciphermeet
      POSTGRES_PASSWORD: ciphermeet_dev_password
      POSTGRES_DB: ciphermeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphermeet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: ciphermeet_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ciphermeet_messages
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ciphermeet_redis
    restart: unless-stopped
    command: redis-server --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./cipher-meet-backend
      dockerfile: Dockerfile
    container_name: ciphermeet_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ciphermeet
      POSTGRES_PASSWORD: ciphermeet_dev_password
      POSTGRES_DB: ciphermeet
      MONGODB_URI: mongodb://mongodb:27017/ciphermeet_messages
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cipher-meet-backend/src:/app/src   # Hot reload in dev
    develop:
      watch:
        - action: sync
          path: ./cipher-meet-backend/src
          target: /app/src

volumes:
  postgres_data:
  mongo_data:
  redis_data:
